[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fii-insights"
version = "0.1.0"
description = "Análise e recomendação de FIIs com scoring e K-Means"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.28,<0.29",
    "beautifulsoup4>=4.13,<5.0",
    "lxml>=5.3,<6.0",
    "pandas>=2.2,<3.0",
    "numpy>=2.2,<3.0",
    "scikit-learn>=1.6,<2.0",
    "matplotlib>=3.10,<4.0",
    "seaborn>=0.13,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["migrations/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "seaborn.*", "matplotlib.*", "bs4.*"]
ignore_missing_imports = true
